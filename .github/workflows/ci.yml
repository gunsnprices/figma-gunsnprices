name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # typecheck, build, unit tests, tests of the built plugin against a mock of the Figma API
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            manifest.json
            dist/
